name: Probe a site (information only)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          while read u; do
            [ -z "$u" ] && continue
            id=$(echo "$u" | grep -oE '[0-9]{8,}$' || true)
            t="$u"; case "$u" in *linkedin.com*) t="https://www.linkedin.com/jobs-guest/jobs/api/jobPosting/$id";; esac
            echo "=================== $u"
            curl -sSL -m 20 -A "$UA" -o /tmp/p -w "HTTP %{http_code} final=%{url_effective} %{size_download}B\n" "$t" || true
            sed 's/<[^>]*>/ /g' /tmp/p | tr -s ' \n' | grep -ioE ".{0,80}(no longer|expired|closed|has been filled|not available|accepting applications|removed|apply now|apply for this job|easy apply).{0,80}" | head -4
            sleep 3
          done < probe-urls.txt
