name: Probe a site (information only)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (finance-job-radar)"
          for u in https://cv-bridge.co.uk/robots.txt https://cv-bridge.co.uk/terms-and-conditions "https://cv-bridge.co.uk/search-jobs/jobs?keywords=financial%20analyst" https://www.totaljobs.com/robots.txt https://www.cv-library.co.uk/robots.txt; do
            echo "=================== $u"
            curl -sSL -m 20 -A "$UA" -o /tmp/p -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$u" || true
            case "$u" in *robots*) head -c 3000 /tmp/p;; *terms*) sed 's/<[^>]*>/ /g' /tmp/p | tr -s ' \n' | grep -ioE ".{0,250}(scrap|automat|robot|crawl|harvest|data min|spider|bot\b).{0,250}" | head -10; sed 's/<[^>]*>/ /g' /tmp/p | tr -s ' \n' | grep -ioE ".{0,200}(adzuna|feed|third.party job|aggregat).{0,200}" | head -5;; *) grep -oE 'href="[^"]*(job|vacanc)[^"]*"' /tmp/p | head -15; grep -ioE "adzuna|reed|indeed|jobg8|broadbean" /tmp/p | sort | uniq -c;; esac
            echo
          done
