name: Fetch job descriptions

# Run by hand: downloads the description of every open role on both radars
# into reports/jds.jsonl.gz, for CV keyword analysis. Sends no alerts.
on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: finance-job-radar
  cancel-in-progress: false

env:
  CAREER_OPS_VERSION: career-ops-v1.38.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download career-ops
        run: |
          git clone --quiet --depth 1 --branch "$CAREER_OPS_VERSION" https://github.com/career-ops-hq/career-ops.git "$RUNNER_TEMP/engine"
          cd "$RUNNER_TEMP/engine" && npm install --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Download job descriptions for every open role (UK + India)
        env:
          CAREER_OPS_ROOT: ${{ github.workspace }}
        run: node scripts/fetch-jds.mjs --engine "$RUNNER_TEMP/engine"
      - name: Save the report
        run: |
          git config user.name "finance-job-radar"
          git config user.email "finance-job-radar@users.noreply.github.com"
          git add -f reports/jds.jsonl.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "job descriptions $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
